events {}

http {
    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    # Extra snippets. Empty normally; `break.sh reload` drops a broken one here so `nginx -t` fails.
    include /etc/nginx/conf.d/*.conf;

    # Docker's DNS. Upstreams are looked up per request (via variables below), so nginx starts and
    # `nginx -t` passes even when an app container is down — a missing app must never block a reload.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Plain HTTP: ACME http-01 challenges only.
    server {
        listen 80;
        server_name demo.lab shop.prod;

        location /.well-known/acme-challenge/ {
            root /var/www/acme;
            default_type text/plain;
        }
        location / {
            return 200 "certagent lab (http)\n";
        }
    }

    # demo.lab — env: lab. The agent renews and installs server.crt/server.key. Proxies to storefront.
    server {
        listen 443 ssl;
        server_name demo.lab;
        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        location / {
            set $up storefront:8080;
            proxy_pass http://$up;
            proxy_set_header Host              $host;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header X-Forwarded-Proto https;
        }
    }

    # shop.prod — env: prod. Policy denies changes; it exists to show the agent stopping. Proxies to checkout.
    server {
        listen 8444 ssl;
        server_name shop.prod;
        ssl_certificate     /etc/nginx/certs/prod.crt;
        ssl_certificate_key /etc/nginx/certs/prod.key;
        location / {
            set $up checkout:8080;
            proxy_pass http://$up;
            proxy_set_header Host              $host;
            proxy_set_header X-Forwarded-Host  $host;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}

# Demo apps for the CertAgent lab: two Java services behind the lab's nginx, and a traffic probe that calls
# them over HTTPS like real clients. Runs as its own compose project on the lab's network, so the lab's
# compose file (in cert-verif-app) is not modified.
#
#   storefront  <- nginx :443  demo.lab   (no host port; nginx is the only way in)
#   checkout    <- nginx :8444 shop.prod  (no host port)
#   traffic-probe -> https://demo.lab/api/products, https://shop.prod:8444/api/orders; page on :8090
#
# Start with demo/reset.sh (it brings the lab up first; this network must exist).
name: certagent-demo

services:
  storefront:
    build: ./storefront
    restart: unless-stopped

  checkout:
    build: ./checkout
    restart: unless-stopped

  accounts:
    build: ./accounts
    restart: unless-stopped

  traffic-probe:
    build: ./traffic-probe
    restart: unless-stopped
    ports:
      - "8090:8090"
    volumes:
      # The whole folder, read-only: mounting just root_ca.crt would make Docker create a directory in its
      # place if the file did not exist yet. The probe reads only root_ca.crt and re-reads it on every check.
      - ${CERTAGENT_HOME:-../cert-verif-app}/lab/certs:/certs:ro

  # Feeds the live reasoning panel on the probe page (/live). Hosted model (Muse Spark): follows CertAgent's
  # timeline and replays the reasoning written on each tool call. Local Glimmer: start CertAgent with
  # OLLAMA_URL=http://localhost:11435 and the relay streams Ollama's thinking tokens while still returning the same
  # single answer CertAgent expects.
  reasoning-relay:
    build: ./reasoning-relay
    restart: unless-stopped
    ports:
      - "11435:11435"
    environment:
      UPSTREAM: http://host.docker.internal:11434
      AGENT: http://host.docker.internal:8088
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  default:
    name: certagent-lab_default
    external: true
